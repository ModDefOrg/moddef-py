[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moddef"
version = "0.1.0"
description = "ModDef runtime for Python: parse declarative Modbus device definitions, decode/encode points, drive devices"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "protobuf>=7.35,<8",
    "pyyaml>=6",
]

[project.optional-dependencies]
pymodbus = ["pymodbus>=3.13"]

[project.urls]
Repository = "https://github.com/ModDefOrg/moddef-py"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pymodbus>=3.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/moddef"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
